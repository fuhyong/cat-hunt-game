<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<!-- iOS Web App Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adaptive Gecko">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Adaptive Feline Engine</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0b0f14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  #start-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(11, 15, 20, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }
  .btn {
    background: #10b981;
    color: white;
    border: none;
    padding: 18px 36px;
    margin: 10px;
    font-size: 1.3rem;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
  }

  #end-screen, #pause-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(11, 15, 20, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
    text-align: center;
    padding: 24px;
  }
  #end-screen p, #pause-overlay p {
    color: rgba(255, 255, 255, 0.85);
    font-size: 1.1rem;
    margin: 4px 0;
    max-width: 320px;
  }
  #end-screen .catch-count {
    color: #10b981;
    font-size: 2.4rem;
    font-weight: bold;
  }
  /* Muted, low-contrast HUD so it doesn't compete with the prey for the
     cat's attention -- this is a control surface for the owner, not part
     of the species-appropriate visual design of the game itself. */
  #session-hud {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 150;
    display: none;
    align-items: center;
    gap: 10px;
  }
  #session-timer {
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }
  #pause-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.07);
    border: none;
    color: rgba(255, 255, 255, 0.35);
    font-size: 0.9rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>

<div id="start-screen">
  <button class="btn" id="start-btn">Start Game (Enable Audio)</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="session-hud">
  <span id="session-timer">6:00</span>
  <button id="pause-btn" aria-label="Pause">&#10074;&#10074;</button>
</div>

<div id="pause-overlay">
  <p>Session paused.</p>
  <button class="btn" id="resume-btn">Resume</button>
  <button class="btn" id="end-session-btn" style="background:#374151; box-shadow:none;">End Session</button>
</div>

<div id="end-screen">
  <div class="catch-count" id="end-catch-count">0</div>
  <p>catches this session</p>
  <p style="margin-top:18px;">Time for a real catch &mdash; offer a treat or a favourite toy now.</p>
  <button class="btn" id="play-again-btn" style="margin-top:22px;">Play Again</button>
</div>

<script>
/*
 * v1.4 — engine fixes (see project review for full rationale):
 *   1. Reward now scores sustained engagement (interaction attempts per chase),
 *      not raw catch speed — a slow/easy catch no longer outscores a hard-won one.
 *   2. Fixed-timestep simulation — gameplay speed no longer depends on the
 *      device's display refresh rate (60Hz vs 120Hz previously played differently).
 *   3. Exploitation step now averages the top-K trials (with a proper circular
 *      mean for hue) instead of anchoring on a single historical best trial.
 *   4. Touch detection now checks a short window of recent prey positions,
 *      not just the instantaneous one, and a secondary DeviceMotion channel
 *      is logged (not yet used to trigger hits) so real pounce sensitivity
 *      can be validated against video before it's trusted for gameplay.
 *
 * v1.5 -- session structure (project review S4, roadmap step 3):
 *   Sessions are timer-bounded (default 6 minutes -- SESSION_DURATION_MS)
 *   and now always end by design instead of running until the device is
 *   put away. Ending shows the session's catch count and a cue to finish
 *   the predatory sequence physically -- a real treat or toy -- since a
 *   screen structurally can't complete it. A hold-to-pause control (not a
 *   tap, so a cat's quick paw strike can't trigger it) lets the owner
 *   pause or end a session early.
 *
 * v1.6 -- visual polish (human-facing only, no gameplay/hue changes):
 *   Hiding spots are now a stylized leaf silhouette (with veins) instead of
 *   a plain circle, and the gecko has googly eyes (pupils drift with travel
 *   direction) and simple back speckles. Purely cosmetic -- the feline-safe
 *   hue range, motion patterns, and hit/hide detection radii are untouched.
 */
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let isPaused = true;
  let scaleUnit = 1;
  // Cached radial gradient + static corner foliage: purely a background
  // polish pass for the human watching over the cat's shoulder. Both are
  // built once per resize (not per frame) and both stay low-contrast/no-
  // motion on purpose so they don't compete with the gecko or hiding spots
  // for the cat's attention -- see drawCornerFoliage()/updateBackgroundGradient().
  let bgGradient = null;
  const cornerFoliage = [];

  // --- SESSION STRUCTURE ---
  const SESSION_DURATION_MS = 6 * 60 * 1000; // placeholder default -- tune once
                                              // real session-length data exists
  let sessionElapsedMs = 0;
  let sessionCatchCount = 0;
  let lastShownSeconds = null;

  // --- TELEMETRY & ADAPTIVE LEARNING ENGINE ---
  const Telemetry = {
    profile: null,
    init() {
      let data = localStorage.getItem('feline_app_identity');
      if (!data) {
        data = {
          deviceId: (crypto.randomUUID) ? crypto.randomUUID() : 'cat_' + Date.now(),
          trials: [] // History of catches: params + engagement score + diagnostics
        };
      } else {
        data = JSON.parse(data);
      }
      this.profile = data;
    },
    // meta: { attempts, latencyMs, motionCorroborated }
    logTrial(params, meta) {
      // Reward = sustained interaction during the chase, capped so a long
      // run of frantic misses doesn't dominate a genuinely well-matched one.
      const cappedAttempts = Math.max(1, Math.min(meta.attempts, 8));
      const rewardScore = cappedAttempts * 1000;

      this.profile.trials.push({
        ...params,
        rewardScore,
        attempts: meta.attempts,
        latencyMs: meta.latencyMs,           // kept for diagnostics only — not used as reward
        motionCorroborated: meta.motionCorroborated,
        timestamp: Date.now()
      });

      // Keep sliding window of latest 100 trials to optimize memory
      if (this.profile.trials.length > 100) this.profile.trials.shift();

      localStorage.setItem('feline_app_identity', JSON.stringify(this.profile));
    },
    // Circular mean so hues near the 0/360 wraparound (e.g. 350° and 10°)
    // average to ~0° instead of being pulled toward 180° by a naive mean.
    _circularMeanHue(hues) {
      let sumSin = 0, sumCos = 0;
      hues.forEach(h => {
        const rad = h * Math.PI / 180;
        sumSin += Math.sin(rad);
        sumCos += Math.cos(rad);
      });
      let meanRad = Math.atan2(sumSin / hues.length, sumCos / hues.length);
      let meanDeg = meanRad * 180 / Math.PI;
      if (meanDeg < 0) meanDeg += 360;
      return meanDeg;
    },
    generateNextPreyParams() {
      // Epsilon-Greedy: 20% random exploration, 80% exploitation of best traits
      if (Math.random() < 0.2 || this.profile.trials.length < 5) {
        return {
          scaleMultiplier: Number((Math.random() * 0.7 + 0.7).toFixed(2)), // 0.7x to 1.4x
          speedMultiplier: Number((Math.random() * 1.4 + 0.8).toFixed(2)), // 0.8x to 2.2x
          hue: Math.floor(Math.random() * 180 + 60) // 60° (Yellow) to 240° (Blue)
        };
      } else {
        // Exploit: average the top-K trials rather than anchoring on a
        // single historical best (which is highly sensitive to one lucky
        // outlier — the "winner's curse" problem). K scales gently with
        // how much data we have.
        // Shuffle a copy before sorting so ties in rewardScore (very common --
        // cappedAttempts only takes ~8 distinct integer values, so many
        // trials land on the exact same score) don't deterministically
        // favor whichever trial happened to be logged first. Array.sort is
        // stable, so without this, "top K" was quietly always the oldest
        // trials at a given score -- and since hue has no causal link to
        // reward, topK's averaged hue just echoed whatever hue those old
        // trials happened to have. That's what made the gecko's color look
        // "stuck" on one value (usually green) for very long stretches.
        const shuffled = [...this.profile.trials];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const sorted = shuffled.sort((a, b) => b.rewardScore - a.rewardScore);
        const k = Math.max(1, Math.min(5, Math.ceil(sorted.length * 0.3)));
        const topK = sorted.slice(0, k);

        const avgScale = topK.reduce((s, t) => s + t.scaleMultiplier, 0) / topK.length;
        const avgSpeed = topK.reduce((s, t) => s + t.speedMultiplier, 0) / topK.length;
        const avgHue = this._circularMeanHue(topK.map(t => t.hue));

        return {
          scaleMultiplier: Math.max(0.65, Number((avgScale + (Math.random() * 0.2 - 0.1)).toFixed(2))),
          speedMultiplier: Math.max(0.75, Number((avgSpeed + (Math.random() * 0.4 - 0.2)).toFixed(2))),
          hue: Math.round((avgHue + (Math.random() * 20 - 10) + 360) % 360)
        };
      }
    }
  };
  Telemetry.init();

  // --- FELINE-TUNED AUDIO SYNTHESIZER ---
  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      // Audio buffer unlock for iOS WebKit
      const buffer = this.ctx.createBuffer(1, 1, 22050);
      const source = this.ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(this.ctx.destination);
      source.start(0);
    },
    playSqueak(pitch = 4200) {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(pitch + 1400, this.ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + 0.09);
    },
    playHit() {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(3200, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + 0.35);
    },
    playRustle() {
      if (!this.ctx || this.ctx.state !== 'running' || Math.random() > 0.3) return;
      const bufferSize = this.ctx.sampleRate * 0.04;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 4500;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
      noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
      noise.start();
    }
  };

  // --- SECONDARY DETECTION CHANNEL (diagnostic only, not yet a hit trigger) ---
  // Capacitive touchscreens miss a meaningful fraction of genuine cat-paw
  // strikes. A DeviceMotion transient is a corroborating signal, logged
  // alongside touch data so real sensitivity/specificity can be measured
  // against video before this channel is trusted to influence gameplay.
  const MotionSense = {
    recentSpikes: [],       // timestamps (ms) of recent acceleration transients
    baseline: 9.8,          // running estimate of resting |acceleration|
    enabled: false,
    init() {
      // Guard against re-attaching a second devicemotion listener every time
      // a new session starts (startSession() now runs once per Play Again,
      // not just once per page load).
      if (this.enabled) return;
      const attach = () => {
        window.addEventListener('devicemotion', (e) => this._onMotion(e), { passive: true });
        this.enabled = true;
      };
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        // iOS 13+ requires this to be called from a user-gesture handler.
        DeviceMotionEvent.requestPermission().then(state => {
          if (state === 'granted') attach();
        }).catch(() => {});
      } else if (typeof DeviceMotionEvent !== 'undefined') {
        attach();
      }
    },
    _onMotion(e) {
      const a = e.accelerationIncludingGravity || e.acceleration;
      if (!a || a.x === null) return;
      const mag = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
      // Slow-adapting baseline so a spike is judged against "resting", not zero.
      this.baseline = this.baseline * 0.95 + mag * 0.05;
      if (mag - this.baseline > 6) {
        const now = Date.now();
        this.recentSpikes.push(now);
        // keep only the last ~2s of spikes
        this.recentSpikes = this.recentSpikes.filter(t => now - t < 2000);
      }
    },
    hasRecentSpike(withinMs = 150) {
      const now = Date.now();
      return this.recentSpikes.some(t => now - t <= withinMs);
    }
  };

  function startSession() {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
    else if (docEl.webkitRequestFullscreen) try { docEl.webkitRequestFullscreen(); } catch(e) {}

    AudioEngine.init();
    MotionSense.init();

    sessionElapsedMs = 0;
    sessionCatchCount = 0;
    lastShownSeconds = null;
    accumulatorMs = 0;
    lastFrameTime = null;
    updateSessionTimerDisplay();

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'none';
    document.getElementById('pause-overlay').style.display = 'none';
    document.getElementById('session-hud').style.display = 'flex';
    isPaused = false;
  }

  function formatMs(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function updateSessionTimerDisplay() {
    const remaining = SESSION_DURATION_MS - sessionElapsedMs;
    const seconds = Math.max(0, Math.ceil(remaining / 1000));
    if (seconds !== lastShownSeconds) {
      document.getElementById('session-timer').textContent = formatMs(remaining);
      lastShownSeconds = seconds;
    }
  }

  // Always the same ending, whether reached by the timer or by the owner
  // tapping "End Session" -- a designed stop, never just "device put away".
  function endSession() {
    isPaused = true;
    document.getElementById('session-hud').style.display = 'none';
    document.getElementById('pause-overlay').style.display = 'none';
    document.getElementById('end-catch-count').textContent = sessionCatchCount;
    document.getElementById('end-screen').style.display = 'flex';
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }

  function pauseSession() {
    if (isPaused) return;
    isPaused = true;
    document.getElementById('pause-overlay').style.display = 'flex';
  }

  function resumeSession() {
    document.getElementById('pause-overlay').style.display = 'none';
    isPaused = false;
  }

  document.getElementById('start-btn').addEventListener('touchstart', startSession, { passive: true });
  document.getElementById('start-btn').addEventListener('click', startSession);
  document.getElementById('play-again-btn').addEventListener('click', startSession);
  document.getElementById('resume-btn').addEventListener('click', resumeSession);
  document.getElementById('end-session-btn').addEventListener('click', endSession);

  // Pause is a ~500ms hold, not a tap -- a cat's quick paw strike on the
  // corner of the screen shouldn't be able to pause the session; only a
  // deliberate hold from the owner should.
  (() => {
    const pauseBtn = document.getElementById('pause-btn');
    let holdTimer = null;
    const startHold = (e) => {
      e.preventDefault();
      holdTimer = setTimeout(() => { pauseSession(); holdTimer = null; }, 500);
    };
    const cancelHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
    pauseBtn.addEventListener('pointerdown', startHold);
    pauseBtn.addEventListener('pointerup', cancelHold);
    pauseBtn.addEventListener('pointerleave', cancelHold);
    pauseBtn.addEventListener('pointercancel', cancelHold);
  })();

  // --- ENVIRONMENT (HIDING SPOTS) ---
  const hidingSpots = [];
  function generateHidingSpots() {
    hidingSpots.length = 0;
    const padRadius = scaleUnit * 50;
    for(let i = 0; i < 4; i++) {
      hidingSpots.push({
        x: Math.random() * (canvas.width - padRadius * 2) + padRadius,
        y: Math.random() * (canvas.height - padRadius * 2) + padRadius,
        radius: padRadius * (0.8 + Math.random() * 0.4),
        // Fixed at creation (not re-randomized per frame) so each leaf has
        // a stable, slightly asymmetric shape and orientation.
        rotation: Math.random() * Math.PI * 2,
        lobeSkew: 0.55 + Math.random() * 0.35,
        shaking: false
      });
    }
  }

  // Stylized leaf silhouette, drawn pointing "up" (tip at -radius, base at
  // +radius) before the caller's rotation is applied. Kept dark and
  // low-contrast on purpose: these are camouflage elements for the cat, not
  // a visual attractor meant to compete with the prey, so the vein detail
  // is a human-facing polish touch rather than a saturation/contrast bump.
  function drawLeafShape(radius, lobeSkew) {
    const rightCtrlX = radius * lobeSkew;
    const leftCtrlX = -radius * (lobeSkew * 0.85);

    ctx.beginPath();
    ctx.moveTo(0, radius);
    ctx.quadraticCurveTo(rightCtrlX, radius * 0.25, 0, -radius);
    ctx.quadraticCurveTo(leftCtrlX, radius * 0.25, 0, radius);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
    ctx.lineWidth = Math.max(1, radius * 0.04);
    ctx.beginPath();
    ctx.moveTo(0, radius * 0.85);
    ctx.lineTo(0, -radius * 0.85);
    ctx.stroke();

    [0.15, -0.35].forEach(t => {
      const vy = radius * t;
      const spread = radius * 0.4 * (1 - Math.abs(t));
      ctx.beginPath();
      ctx.moveTo(0, vy);
      ctx.lineTo(spread, vy - radius * 0.15);
      ctx.moveTo(0, vy);
      ctx.lineTo(-spread, vy - radius * 0.15);
      ctx.stroke();
    });
  }

  function drawHidingSpots() {
    hidingSpots.forEach(spot => {
      ctx.save();
      ctx.translate(spot.x, spot.y);
      if (spot.shaking) {
        ctx.translate(Math.sin(Date.now() / 25) * (scaleUnit * 2.5), Math.cos(Date.now() / 25) * (scaleUnit * 2.5));
      }
      ctx.rotate(spot.rotation);
      ctx.fillStyle = '#142a1b';
      drawLeafShape(spot.radius, spot.lobeSkew);
      ctx.restore();
    });
  }

  // --- PREY LOGIC (ADAPTIVE GECKO) ---
  class Gecko {
    constructor() {
      this.reset();
    }

    reset() {
      this.params = Telemetry.generateNextPreyParams();

      this.x = Math.random() * (canvas.width - 200) + 100;
      this.y = Math.random() * (canvas.height - 200) + 100;

      this.baseSpeed = scaleUnit * 3.5 * this.params.speedMultiplier;
      this.vx = this.baseSpeed;
      this.vy = this.baseSpeed;
      this.hue = this.params.hue;
      this.sizeMult = this.params.scaleMultiplier;

      this.state = 'moving';
      this.stateTimer = 0;
      this.angle = 0;
      this.legCycle = 0;
      this.activeLeaf = null;
      this.spawnTime = Date.now();

      // Engagement tracking for the current chase (reset per gecko life-cycle,
      // i.e. per catch — see checkHit()).
      this.attemptsThisChase = 0;

      // Short position history so a fast-moving target is still catchable
      // even if the touch event lands a beat after the visual strike.
      this.positionHistory = [];
    }

    update() {
      // Record position history every tick regardless of state (used for the
      // widened temporal hit-test below). One tick == one fixed-timestep step,
      // so this history's real-world duration is now device-independent too.
      this.positionHistory.push({ x: this.x, y: this.y, t: Date.now() });
      const cutoff = Date.now() - 200;
      while (this.positionHistory.length && this.positionHistory[0].t < cutoff) {
        this.positionHistory.shift();
      }

      if (this.state === 'caught') {
        this.stateTimer--;
        this.angle += (Math.random() - 0.5) * 0.7;
        this.legCycle += 1.4;

        if (this.stateTimer <= 0) {
          this.reset();
        }
        return;
      }

      if (this.state === 'hiding') {
        this.stateTimer--;
        if (this.activeLeaf) this.activeLeaf.shaking = true;
        if (this.stateTimer <= 0) {
          this.state = 'moving';
          if (this.activeLeaf) this.activeLeaf.shaking = false;
          this.activeLeaf = null;
          this.vx = (Math.random() - 0.5) * (this.baseSpeed * 3.5);
          this.vy = (Math.random() - 0.5) * (this.baseSpeed * 3.5);
          this.spawnTime = Date.now();
          AudioEngine.playSqueak(4600);
        }
        return;
      }

      if (this.state === 'frozen') {
        this.stateTimer--;
        if (this.stateTimer <= 0) {
          this.state = 'moving';
          this.spawnTime = Date.now(); // was previously not reset here — inflated
                                        // the (now-diagnostic-only) latency figure
                                        // by however long the freeze lasted.
          this.vx = (Math.random() - 0.5) * (this.baseSpeed * 2.2);
          this.vy = (Math.random() - 0.5) * (this.baseSpeed * 2.2);
        }
        return;
      }

      if (this.state === 'moving') {
        this.legCycle += 0.45 * this.params.speedMultiplier;
        AudioEngine.playRustle();

        if (Math.random() < 0.02) AudioEngine.playSqueak();

        if (Math.random() < 0.012) {
          this.state = 'frozen';
          this.stateTimer = Math.random() * 50 + 25;
          return;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.angle = Math.atan2(this.vy, this.vx);

        if (Math.random() < 0.05) {
          for (let spot of hidingSpots) {
            let dist = Math.hypot(this.x - spot.x, this.y - spot.y);
            if (dist < spot.radius * 0.7) {
              this.state = 'hiding';
              this.stateTimer = Math.random() * 200 + 100;
              this.activeLeaf = spot;
              return;
            }
          }
        }

        const boundPad = -scaleUnit * 40 * this.sizeMult;
        if (this.x < boundPad) this.vx = Math.abs(this.vx) + 0.5;
        if (this.x > canvas.width - boundPad) this.vx = -Math.abs(this.vx) - 0.5;
        if (this.y < boundPad) this.vy = Math.abs(this.vy) + 0.5;
        if (this.y > canvas.height - boundPad) this.vy = -Math.abs(this.vy) - 0.5;
      }
    }

    draw() {
      if (this.state === 'hiding') return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      ctx.fillStyle = `hsl(${this.hue}, 90%, 60%)`;
      ctx.strokeStyle = `hsl(${this.hue}, 90%, 60%)`;
      ctx.lineWidth = Math.max(2, scaleUnit * 3.5 * this.sizeMult);

      if (this.state === 'caught') {
        ctx.scale(1.1, 0.7);
        ctx.fillStyle = '#ef4444';
      }

      const drawScale = scaleUnit * this.sizeMult;
      const legSwing = (this.state === 'moving' || this.state === 'caught') ? Math.sin(this.legCycle) * (drawScale * 6) : 0;

      ctx.beginPath(); ctx.moveTo(drawScale * 4, -drawScale * 4); ctx.lineTo(drawScale * 8 + legSwing, -drawScale * 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(drawScale * 4, drawScale * 4); ctx.lineTo(drawScale * 8 - legSwing, drawScale * 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-drawScale * 4, -drawScale * 4); ctx.lineTo(-drawScale * 8 - legSwing, -drawScale * 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-drawScale * 4, drawScale * 4); ctx.lineTo(-drawScale * 8 + legSwing, drawScale * 12); ctx.stroke();

      const tailSwish = (this.state === 'moving' || this.state === 'caught') ? Math.sin(this.legCycle * 0.8) * (drawScale * 10) : 0;
      ctx.beginPath();
      ctx.moveTo(-drawScale * 12, 0);
      ctx.quadraticCurveTo(-drawScale * 20, tailSwish, -drawScale * 28, 0);
      ctx.stroke();

      ctx.beginPath(); ctx.ellipse(0, 0, drawScale * 14, drawScale * 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(drawScale * 12, 0, drawScale * 7, drawScale * 5, 0, 0, Math.PI * 2); ctx.fill();

      // --- Charm details for the human owner -- purely cosmetic, same hue
      // family and body silhouette as before, so this doesn't touch the
      // feline-safe visual design above. ---

      // Simple back speckles, same hue but darker, along the spine.
      ctx.fillStyle = `hsl(${this.hue}, 60%, 35%)`;
      [-6, 0, 6].forEach(sx => {
        ctx.beginPath();
        ctx.ellipse(sx * (drawScale / 2), 0, drawScale * 1.1, drawScale * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Googly eyes on the head. Pupils drift slightly toward the direction
      // of travel -- a cheap "alive" touch computed from existing vx/vy.
      const eyeOffsetX = drawScale * 15;
      const eyeOffsetY = drawScale * 3.2;
      const eyeRadius = drawScale * (this.state === 'caught' ? 3.4 : 2.6);
      const pupilRadius = eyeRadius * 0.5;
      const moveAngle = Math.atan2(this.vy, this.vx);
      const pupilDrift = eyeRadius * 0.3;
      const pdx = Math.cos(moveAngle - this.angle) * pupilDrift;
      const pdy = Math.sin(moveAngle - this.angle) * pupilDrift;

      [-1, 1].forEach(side => {
        const ex = eyeOffsetX;
        const ey = eyeOffsetY * side;
        ctx.beginPath();
        ctx.fillStyle = '#f5f5f0';
        ctx.ellipse(ex, ey, eyeRadius, eyeRadius, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.fillStyle = '#1a1a1a';
        ctx.ellipse(ex + pdx, ey + pdy, pupilRadius, pupilRadius, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    // Called on every interaction while the gecko is catchable, whether or
    // not it actually lands — this is what makes attempt-counting possible.
    // Returns true if this attempt was a successful catch.
    checkHit(px, py) {
      if (this.state === 'caught' || this.state === 'hiding') return false;

      this.attemptsThisChase++;

      // Check against the gecko's recent position history (last ~120ms), not
      // just its current instantaneous position — a fast-moving target can
      // have moved meaningfully between a genuine paw strike and the event
      // actually firing.
      const recentCutoff = Date.now() - 120;
      const candidates = this.positionHistory.filter(p => p.t >= recentCutoff);
      if (candidates.length === 0) candidates.push({ x: this.x, y: this.y });

      const hitRadius = scaleUnit * 45 * this.sizeMult;
      const hit = candidates.some(p => Math.hypot(p.x - px, p.y - py) < hitRadius);

      if (hit) {
        this.state = 'caught';
        this.stateTimer = 90;

        const latency = Date.now() - this.spawnTime;
        const motionCorroborated = MotionSense.hasRecentSpike(150);
        Telemetry.logTrial(this.params, {
          attempts: this.attemptsThisChase,
          latencyMs: latency,
          motionCorroborated
        });

        AudioEngine.playHit();
        sessionCatchCount++;
        return true;
      }
      return false;
    }
  }

  const gecko = new Gecko();

  function handleInteraction(e) {
    if (!isPaused) {
      AudioEngine.init();
      gecko.checkHit(e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY));
    }
  }

  canvas.addEventListener('pointerdown', handleInteraction);
  canvas.addEventListener('touchstart', handleInteraction, { passive: true });

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    scaleUnit = Math.max(0.75, Math.min(canvas.width, canvas.height) / 480);
    generateHidingSpots();
    updateBackgroundGradient();
    generateCornerFoliage();
  }

  // Replaces the old flat #080d14 fill. A subtle center-to-edge gradient
  // reads as "designed" to a human glancing at the screen while staying
  // dark and low-contrast everywhere the gecko/leaves actually move --
  // the two stops are close in lightness on purpose.
  function updateBackgroundGradient() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r = Math.max(canvas.width, canvas.height) * 0.75;
    bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    bgGradient.addColorStop(0, '#0d141c');
    bgGradient.addColorStop(1, '#05080c');
  }

  // Four large, static, very-low-opacity leaves anchored to the corners --
  // reuses drawLeafShape() so the foliage motif is consistent with the
  // hiding spots. Static (no shake, no re-randomization per frame) and
  // faint enough to stay well below the hiding spots and gecko in visual
  // weight, so it adds finish for the owner without adding any new motion
  // or contrast cue for the cat to key off of.
  function generateCornerFoliage() {
    cornerFoliage.length = 0;
    const r = scaleUnit * 90;
    const corners = [
      { x: 0, y: 0, rotation: 0.4 },
      { x: canvas.width, y: 0, rotation: Math.PI - 0.4 },
      { x: 0, y: canvas.height, rotation: -0.4 },
      { x: canvas.width, y: canvas.height, rotation: Math.PI + 0.4 }
    ];
    corners.forEach(c => {
      cornerFoliage.push({ x: c.x, y: c.y, radius: r, rotation: c.rotation, lobeSkew: 0.7 });
    });
  }

  function drawCornerFoliage() {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#15301f';
    cornerFoliage.forEach(leaf => {
      ctx.save();
      ctx.translate(leaf.x, leaf.y);
      ctx.rotate(leaf.rotation);
      drawLeafShape(leaf.radius, leaf.lobeSkew);
      ctx.restore();
    });
    ctx.restore();
  }
  window.addEventListener('resize', resize);
  resize();

  // --- FIXED-TIMESTEP SIMULATION LOOP ---
  // gecko.update() is now called at a fixed, wall-clock-locked rate (one
  // tick ≈ 1000/60 ms of real time) via this accumulator, regardless of how
  // often requestAnimationFrame actually fires. On a 120Hz display this
  // calls update() twice per rendered frame instead of once; on 60Hz, once
  // as before. Movement, state timers and per-tick probabilities were all
  // tuned assuming "one update per ~16.7ms", so this is what makes that
  // assumption true everywhere instead of only on 60Hz hardware.
  const FIXED_DT_MS = 1000 / 60;
  const MAX_STEPS_PER_FRAME = 5; // avoid a "spiral of death" after e.g. the tab was backgrounded
  let lastFrameTime = null;
  let accumulatorMs = 0;

  function loop(timestamp) {
    if (!isPaused) {
      if (lastFrameTime === null) lastFrameTime = timestamp;
      let frameDelta = timestamp - lastFrameTime;
      lastFrameTime = timestamp;
      if (frameDelta > 250) frameDelta = 250; // clamp huge gaps rather than catching up all at once

      sessionElapsedMs += frameDelta;
      updateSessionTimerDisplay();
      if (sessionElapsedMs >= SESSION_DURATION_MS) {
        endSession();
      }

      accumulatorMs += frameDelta;
      let steps = 0;
      while (accumulatorMs >= FIXED_DT_MS && steps < MAX_STEPS_PER_FRAME) {
        gecko.update();
        accumulatorMs -= FIXED_DT_MS;
        steps++;
      }
      if (steps === MAX_STEPS_PER_FRAME) accumulatorMs = 0; // drop backlog instead of spiraling

      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawCornerFoliage();

      gecko.draw();
      drawHidingSpots();
    } else {
      lastFrameTime = null; // avoid a huge delta the instant the game resumes
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
